<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SwiftCart AI - Checkout</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Theme Configuration -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "card-light": "#ffffff",
                        "card-dark": "#1a242d",
                        "text-main-light": "#111418",
                        "text-main-dark": "#e2e8f0",
                        "text-muted-light": "#617589",
                        "text-muted-dark": "#94a3b8",
                    },
                    fontFamily: {
                        "display": ["Inter", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        /* Custom scrollbar for cleaner look within the card */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 20px;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-text-main-light dark:text-text-main-dark transition-colors duration-200">
    <!-- Main Page Container -->
    <div class="min-h-screen w-full flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">
        <!-- Central Card Container -->
        <div
            class="relative w-full max-w-[480px] h-[85vh] max-h-[900px] flex flex-col bg-card-light dark:bg-card-dark rounded-2xl shadow-2xl overflow-hidden border border-gray-100 dark:border-gray-800">
            <!-- Header -->
            <header
                class="flex-none flex items-center justify-between px-6 py-5 border-b border-gray-100 dark:border-gray-800 bg-card-light/95 dark:bg-card-dark/95 backdrop-blur z-10">
                <div class="flex items-center gap-3">
                    <div class="size-8 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
                        <span class="material-symbols-outlined text-[20px]">shopping_cart_checkout</span>
                    </div>
                    <div>
                        <h2
                            class="text-sm font-bold leading-tight tracking-tight uppercase text-text-muted-light dark:text-text-muted-dark">
                            SwiftCart AI</h2>
                        <h1 class="text-lg font-bold leading-tight">Checkout</h1>
                    </div>
                </div>
                <button
                    class="text-sm font-semibold text-text-muted-light dark:text-text-muted-dark hover:text-red-500 dark:hover:text-red-400 transition-colors px-3 py-1.5 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800/50">
                    Cancel
                </button>
            </header>
            <!-- Scrollable Content Area -->
            <div class="flex-1 overflow-y-auto custom-scrollbar">
                <div class="p-6 flex flex-col gap-6">
                    <!-- Order Summary -->
                    <section>
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="text-base font-bold text-text-main-light dark:text-text-main-dark">Order Summary
                            </h3>
                            <button class="text-xs font-semibold text-primary hover:underline">Edit</button>
                        </div>
                        <div class="flex flex-col gap-3">
                            <!-- Item 1 -->
                            <div
                                class="flex items-center gap-4 p-3 rounded-xl bg-background-light dark:bg-background-dark/50 border border-transparent hover:border-gray-200 dark:hover:border-gray-700 transition-all">
                                <div class="relative w-12 h-12 shrink-0 overflow-hidden rounded-lg bg-white">
                                    <img alt="Bunch of yellow bananas" class="w-full h-full object-cover"
                                        data-alt="Fresh yellow bananas"
                                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuAXqi0_NqCVUfhFkp9icG2bVxEH2EWPk3Pt5ZEWOm_yxt_pqakeqDaeQeWB9-Th2ee1mEjvUo_lPWfWRM8pL46bM-BsIlmSrqV7KXLutx7JNAPJkRgiVZWxUFrYSKH8CYUgNM5qAEglekWfmxCCZEEEGCdyhJ9j2rEowRPdcDa69JoKXcFAffHyE_DhmWDqCNqQD_8pbo7UuCLmUJJb7luAsaVd5OOu1JcJ9jEn6xaXfQcb5gmO7GV0LXUTh7yM4_oUUxdc7275V3zG" />
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm font-medium truncate">Organic Bananas</p>
                                    <p class="text-xs text-text-muted-light dark:text-text-muted-dark">Qty: 2</p>
                                </div>
                                <p class="text-sm font-bold">$1.20</p>
                            </div>
                            <!-- Item 2 -->
                            <div
                                class="flex items-center gap-4 p-3 rounded-xl bg-background-light dark:bg-background-dark/50 border border-transparent hover:border-gray-200 dark:hover:border-gray-700 transition-all">
                                <div class="relative w-12 h-12 shrink-0 overflow-hidden rounded-lg bg-white">
                                    <img alt="Fresh sourdough bread loaf" class="w-full h-full object-cover"
                                        data-alt="Sourdough bread loaf"
                                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuDiiHPEwZn-AcfekidM85pwyUf5f_4QamEKb85mWqG-G9xl7nxk2Jz6KAMMoUUJp7rDzgvJoSNstnJmCoixt0BrDokb-t-YOSkFPhIRptJmPrpiLeqq7v9DVVxwFqVYdd-1CZvxi7LPCKI4Jm9gOHj826E6221xanDUGnlitWkYQQtb5seAE3OnpsR46ZW9YKrpCm5QRKkJAz4vNYlGYqzwQBHNZE4EAmHKG1NE1NGe2XA58xEUHr0RfxXUuVgzkku7_V-wgAqkckYR" />
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm font-medium truncate">Sourdough Bread</p>
                                    <p class="text-xs text-text-muted-light dark:text-text-muted-dark">Qty: 1</p>
                                </div>
                                <p class="text-sm font-bold">$4.50</p>
                            </div>
                        </div>
                    </section>
                    <!-- Payment Method -->
                    <section>
                        <h3 class="text-base font-bold text-text-main-light dark:text-text-main-dark mb-3">Payment
                            Method</h3>
                        <!-- Toggle -->
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <label class="cursor-pointer relative group">
                                <input checked="" class="peer sr-only" name="payment_type" type="radio" />
                                <div
                                    class="flex flex-col items-center justify-center p-3 rounded-xl border-2 border-gray-100 dark:border-gray-700 bg-white dark:bg-background-dark peer-checked:border-primary peer-checked:bg-primary/5 transition-all h-20">
                                    <span
                                        class="material-symbols-outlined text-2xl mb-1 text-text-muted-light dark:text-text-muted-dark peer-checked:text-primary">credit_card</span>
                                    <span
                                        class="text-xs font-semibold text-text-muted-light dark:text-text-muted-dark peer-checked:text-primary">Card</span>
                                </div>
                                <div
                                    class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 text-primary transition-opacity">
                                    <span class="material-symbols-outlined text-[18px] fill">check_circle</span>
                                </div>
                            </label>
                            <label class="cursor-pointer relative group">
                                <input class="peer sr-only" name="payment_type" type="radio" />
                                <div
                                    class="flex flex-col items-center justify-center p-3 rounded-xl border-2 border-gray-100 dark:border-gray-700 bg-white dark:bg-background-dark peer-checked:border-primary peer-checked:bg-primary/5 transition-all h-20">
                                    <span
                                        class="material-symbols-outlined text-2xl mb-1 text-text-muted-light dark:text-text-muted-dark peer-checked:text-primary">contactless</span>
                                    <span
                                        class="text-xs font-semibold text-text-muted-light dark:text-text-muted-dark peer-checked:text-primary">Wallet</span>
                                </div>
                            </label>
                        </div>
                        <!-- Card Inputs -->
                        <div class="flex flex-col gap-3">
                            <div class="relative">
                                <label
                                    class="text-xs font-medium text-text-muted-light dark:text-text-muted-dark ml-1 mb-1 block">Card
                                    Number</label>
                                <div class="relative">
                                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                                        <span class="material-symbols-outlined text-[20px]">credit_card</span>
                                    </span>
                                    <input
                                        class="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none text-sm font-medium transition-all dark:placeholder-gray-500"
                                        placeholder="0000 0000 0000 0000" type="text" />
                                    <div class="absolute right-3 top-1/2 -translate-y-1/2">
                                        <img alt="Mastercard Logo" class="h-5 w-auto opacity-70"
                                            data-alt="Mastercard logo"
                                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuAH01yJCUn7kYFZJlYOunxeth2PNCvrCP53ul7pQsLJHIo4NJxoBE8yU-m8tP_p9t4mjCIXicokLwv3iS4Zp2R5U1F3pYUpZtSJjAoBK4RSMr4HEfVQpqEAGUGsRdSKpiBqkkH81mF1W-o3dzSBSfVcJmHpopGSzePNQkzugKHf2ReI2auV43ysRMdu96q2U9ZCtcP1Jp2hx9tKbRvygFq8Mr3fqkGEW-QtyAo_Qdclwyv0_e8LL2DWgImpflEyBbDZHtS9WZJ9vzcM" />
                                    </div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label
                                        class="text-xs font-medium text-text-muted-light dark:text-text-muted-dark ml-1 mb-1 block">Expiry
                                        Date</label>
                                    <input
                                        class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none text-sm font-medium transition-all dark:placeholder-gray-500"
                                        placeholder="MM/YY" type="text" />
                                </div>
                                <div>
                                    <label
                                        class="text-xs font-medium text-text-muted-light dark:text-text-muted-dark ml-1 mb-1 block">CVC</label>
                                    <div class="relative">
                                        <input
                                            class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none text-sm font-medium transition-all dark:placeholder-gray-500"
                                            placeholder="123" type="text" />
                                        <span
                                            class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-[18px]">help</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 mt-2">
                                <input
                                    class="rounded border-gray-300 text-primary focus:ring-primary bg-gray-100 dark:bg-gray-800 dark:border-gray-600"
                                    id="save-card" type="checkbox" />
                                <label class="text-xs text-text-muted-light dark:text-text-muted-dark select-none"
                                    for="save-card">Save card for future purchases</label>
                            </div>
                        </div>
                    </section>
                    <!-- Cost Breakdown -->
                    <section
                        class="bg-gray-50 dark:bg-gray-800/40 rounded-xl p-4 border border-gray-100 dark:border-gray-700/50">
                        <div class="flex flex-col gap-2">
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-text-muted-light dark:text-text-muted-dark">Subtotal</span>
                                <span class="font-medium">$5.70</span>
                            </div>
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-text-muted-light dark:text-text-muted-dark">Taxes (8%)</span>
                                <span class="font-medium">$0.45</span>
                            </div>
                            <div class="flex justify-between items-center text-sm text-green-600 dark:text-green-400">
                                <span class="flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[16px]">auto_awesome</span>
                                    AI Discount
                                </span>
                                <span class="font-medium">-$0.45</span>
                            </div>
                            <div class="h-px w-full bg-gray-200 dark:bg-gray-700 my-1"></div>
                            <div class="flex justify-between items-center text-lg">
                                <span class="font-bold text-text-main-light dark:text-text-main-dark">Total</span>
                                <span class="font-extrabold text-text-main-light dark:text-text-main-dark">$5.70</span>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
            <!-- Footer Action -->
            <footer
                class="flex-none p-6 border-t border-gray-100 dark:border-gray-800 bg-card-light/95 dark:bg-card-dark/95 backdrop-blur z-10 flex flex-col gap-4">
                <button
                    class="w-full bg-primary hover:bg-blue-600 text-white font-bold text-lg h-14 rounded-xl shadow-lg shadow-blue-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                    <span>Pay $5.70</span>
                    <span
                        class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
                </button>
                <div
                    class="flex items-center justify-center gap-1.5 text-xs text-text-muted-light dark:text-text-muted-dark">
                    <span class="material-symbols-outlined text-[14px]">lock</span>
                    <p>Secured by <strong>SwiftCart AI</strong></p>
                    <span class="mx-1">•</span>
                    <a class="hover:underline" href="#">Need help?</a>
                </div>
            </footer>
        </div>
        <!-- Background decorative elements for desktop feel -->
        <div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
            <div
                class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-100/50 dark:bg-blue-900/10 rounded-full blur-[100px]">
            </div>
            <div
                class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-100/50 dark:bg-purple-900/10 rounded-full blur-[100px]">
            </div>
        </div>
    </div>
</body>

</html>
